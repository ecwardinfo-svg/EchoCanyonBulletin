<script>
  function scrollToId(targetId, event) {
    if (event) event.preventDefault();
    var el = document.getElementById(targetId);
    if (el) {
      var y = el.getBoundingClientRect().top + window.pageYOffset;
      window.scrollTo({ top: y, behavior: 'smooth' });
    }
  }

  var toggleBtn = document.getElementById('themeToggle');
  if (toggleBtn) {
    toggleBtn.addEventListener('click', function() {
      var current = document.documentElement.getAttribute('data-theme');
      document.documentElement.setAttribute('data-theme', current === 'dark' ? 'light' : 'dark');
    });
  }

  var SHEET_ID = '1C3drfRrPc43Jkmj3AteRQPX1BxZpPDyqrkIIGC4F0vs';

  function formatSheetDate(year, monthIndex, day) {
    var monthNames = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
    return monthNames[parseInt(monthIndex, 10)] + ' ' + parseInt(day, 10) + ', ' + year;
  }

  function cellText(cell) {
    if (!cell) return '';
    if (cell.f !== null && cell.f !== undefined && String(cell.f).trim() !== '' && String(cell.f).indexOf('Date(') === -1) {
      return String(cell.f).trim();
    }
    if (cell.v === null || cell.v === undefined) return '';
    if (Object.prototype.toString.call(cell.v) === '[object Date]' && !isNaN(cell.v.getTime())) {
      return formatSheetDate(cell.v.getFullYear(), cell.v.getMonth(), cell.v.getDate());
    }
    var raw = String(cell.v).trim();
    var dateMatch = raw.match(/Date\((\d+)\s*,\s*(\d+)\s*,\s*(\d+)\)/);
    if (dateMatch) return formatSheetDate(dateMatch[1], dateMatch[2], dateMatch[3]);
    return raw;
  }

  function extractTable(jsonObj) {
    if (!jsonObj || !jsonObj.table) return [];
    var result = [];
    if (jsonObj.table.cols && jsonObj.table.cols.length > 0) {
      var colRow = jsonObj.table.cols.map(function(c) {
        return c && c.label ? String(c.label).trim() : '';
      });
      if (colRow.some(function(v) { return v !== ''; })) result.push(colRow);
    }
    if (jsonObj.table.rows) {
      jsonObj.table.rows.forEach(function(row) {
        if (!row || !row.c) return;
        result.push(row.c.map(function(cell) { return cellText(cell); }));
      });
    }
    return result;
  }

  function loadScript(sheetName, callbackName) {
    var script = document.createElement('script');
    script.crossOrigin = 'anonymous';
    script.src = 'https://docs.google.com/spreadsheets/d/' + SHEET_ID + '/gviz/tq?sheet=' + encodeURIComponent(sheetName) + '&headers=0&tqx=responseHandler:' + callbackName + '&_t=' + Date.now();
    script.onerror = function() { console.warn('Optional tab not loaded: ' + sheetName); };
    document.body.appendChild(script);
  }

  function formatBadgeTime(rawTime) {
    if (!rawTime) return '';
    var clean = rawTime.replace(/^(mon|tue|wed|thu|fri|sat|sun)[a-z]*\s*[•\-–—:]*\s*/i, '').trim();
    clean = clean.replace(/\s*[-–—]\s*/g, ' – ');
    if (/all\s*day/i.test(clean)) return '<span class="time-range">All Day</span>';
    var match = clean.match(/^(.*?)\s*(am|pm)\b/i);
    if (match) return '<span class="time-range">' + match[1].trim() + '</span><span class="time-meridiem">' + match[2].toLowerCase() + '</span>';
    return '<span class="time-range">' + clean + '</span>';
  }

  function resolveEventDate(dayStr, dateStr) {
    var now = new Date();
    var monthNames = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
    var fullMonths = ['january', 'february', 'march', 'april', 'may', 'june', 'july', 'august', 'september', 'october', 'november', 'december'];
    var dayNames = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];

    function dayIndex(token) {
      var t = (token || '').toLowerCase();
      if (t.indexOf('sun') === 0) return 0;
      if (t.indexOf('mon') === 0) return 1;
      if (t.indexOf('tue') === 0) return 2;
      if (t.indexOf('wed') === 0) return 3;
      if (t.indexOf('thu') === 0) return 4;
      if (t.indexOf('fri') === 0) return 5;
      if (t.indexOf('sat') === 0) return 6;
      return -1;
    }
    function pretty(d) {
      return dayNames[d.getDay()] + ', ' + monthNames[d.getMonth()] + ' ' + d.getDate();
    }
    function upcoming(targetIdx, hour) {
      var diff = (targetIdx - now.getDay() + 7) % 7;
      if (diff === 0 && now.getHours() >= 21) diff = 7;
      return new Date(now.getFullYear(), now.getMonth(), now.getDate() + diff, hour || 12, 0, 0);
    }
    function parseOne(token) {
      var trimmed = (token || '').trim();
      if (!trimmed) return null;
      var sheetDate = trimmed.match(/Date\((\d+)\s*,\s*(\d+)\s*,\s*(\d+)\)/);
      if (sheetDate) return new Date(parseInt(sheetDate[1], 10), parseInt(sheetDate[2], 10), parseInt(sheetDate[3], 10), 12, 0, 0);
      var named = trimmed.match(/^([a-z]+)\s+(\d{1,2})(?:,?\s*(\d{4}))?/i);
      if (named) {
        var mIdx = fullMonths.indexOf(named[1].toLowerCase());
        if (mIdx === -1) mIdx = fullMonths.findIndex(function(m) { return m.indexOf(named[1].toLowerCase()) === 0; });
        if (mIdx !== -1) return new Date(named[3] ? parseInt(named[3], 10) : now.getFullYear(), mIdx, parseInt(named[2], 10), 12, 0, 0);
      }
      var slash = trimmed.match(/^(\d{1,2})\/(\d{1,2})(?:\/(\d{2,4}))?/);
      if (slash) {
        var year2 = slash[3] ? parseInt(slash[3], 10) : now.getFullYear();
        if (year2 < 100) year2 += 2000;
        return new Date(year2, parseInt(slash[1], 10) - 1, parseInt(slash[2], 10), 12, 0, 0);
      }
      var parsed = Date.parse(trimmed);
      if (!isNaN(parsed)) {
        var d = new Date(parsed);
        if (d.getFullYear() < 2020) d.setFullYear(now.getFullYear());
        return d;
      }
      return null;
    }

    var dayPair = (dayStr || '').match(/([a-z]+)\s*(?:&|and)\s*([a-z]+)/i);
    var startIdx = dayPair ? dayIndex(dayPair[1]) : dayIndex(dayStr);
    var endIdx = dayPair ? dayIndex(dayPair[2]) : -1;

    if (dateStr && dateStr.trim()) {
      var trimmedDate = dateStr.trim();
      var rangeParts = trimmedDate.split(/\s*(?:-|–|—|to)\s*/i).filter(function(part) { return part; });
      if (rangeParts.length >= 2) {
        var startDate = parseOne(rangeParts[0]);
        var endDate = parseOne(rangeParts[1]);
        if (startDate && endDate) return { timestamp: startDate.getTime(), displayDate: pretty(startDate) + ' – ' + pretty(endDate) };
      }
      var single = parseOne(trimmedDate);
      if (single) {
        if (dayPair && endIdx !== -1) {
          var span = (endIdx - single.getDay() + 7) % 7;
          var endDateFromDay = new Date(single.getFullYear(), single.getMonth(), single.getDate() + span, 12, 0, 0);
          return { timestamp: single.getTime(), displayDate: pretty(single) + ' – ' + pretty(endDateFromDay) };
        }
        return { timestamp: single.getTime(), displayDate: pretty(single) };
      }
    }

    if (dayPair && startIdx !== -1 && endIdx !== -1) {
      var startDateFromDay = upcoming(startIdx, 8);
      var daySpan = (endIdx - startIdx + 7) % 7;
      if (daySpan === 0) daySpan = 7;
      var endDateFromPair = new Date(startDateFromDay.getFullYear(), startDateFromDay.getMonth(), startDateFromDay.getDate() + daySpan, 12, 0, 0);
      return { timestamp: startDateFromDay.getTime(), displayDate: pretty(startDateFromDay) + ' – ' + pretty(endDateFromPair) };
    }

    var computed = upcoming(startIdx === -1 ? 3 : startIdx, 19);
    return { timestamp: computed.getTime(), displayDate: pretty(computed) };
  }

  function isValiantWeek() {
    var now = new Date();
    var dayOfWeek = now.getDay();
    var hour = now.getHours();
    if (dayOfWeek === 0 && hour < 6) return false;
    if (dayOfWeek > 3) return false;
    if (dayOfWeek === 3 && hour >= 21) return false;
    var daysUntilWed = (3 - dayOfWeek + 7) % 7;
    var targetWed = new Date(now.getFullYear(), now.getMonth(), now.getDate() + daysUntilWed);
    var wedNumber = Math.floor((targetWed.getDate() - 1) / 7) + 1;
    return wedNumber === 1 || wedNumber === 3;
  }

  window.handleAdmin = function(response) {
    var rows = extractTable(response);
    var data = {};
    rows.forEach(function(row) {
      if (row[0]) data[String(row[0]).toLowerCase().replace(/[^a-z0-9]/g, '')] = row[1] ? String(row[1]).trim() : '';
    });
    var wardName = data.wardname || data.ward || '';
    if (wardName) {
      document.getElementById('topWardPillText').textContent = wardName;
      document.getElementById('wardTitle').textContent = wardName;
      document.title = wardName + ' • Digital Bulletin';
    }
    if (data.churchname || data.church) document.getElementById('churchSub').textContent = data.churchname || data.church;
    var broadcastUrl = data.broadcasturl || '';
    var isVisible = (data.broadcastvisible || 'true').toLowerCase() !== 'false';
    var container = document.getElementById('broadcastContainer');
    if (broadcastUrl && isVisible) {
      document.getElementById('broadcastLink').href = broadcastUrl;
      container.style.display = 'flex';
    } else if (!isVisible) container.style.display = 'none';
    if (data.broadcastsubtitle || data.broadcastsub) document.getElementById('broadcastSub').textContent = data.broadcastsubtitle || data.broadcastsub;
  };

  window.handleGeneral = function(response) {
    var rows = extractTable(response);
    var data = {};
    rows.forEach(function(row) {
      if (row[0]) data[String(row[0]).toLowerCase().replace(/[^a-z0-9]/g, '')] = row[1] ? String(row[1]).trim() : '';
    });
    if (data.date) document.getElementById('bulletinDate').textContent = data.date;
    if (data.scripturequote) document.getElementById('scriptureQuote').textContent = '“' + data.scripturequote.replace(/^["“]|["”]$/g, '') + '”';
    if (data.scripturecitation) document.getElementById('scriptureCitation').textContent = data.scripturecitation;
    var imgUrl = data.weeklyimageurl || data.weeklyimage || data.imageurl || '';
    if (imgUrl) {
      var imgEl = document.getElementById('weeklyImg');
      imgEl.src = imgUrl;
      imgEl.style.display = 'block';
      document.getElementById('sacredSvg').style.display = 'none';
    }
    var eventTitle = data.specialeventtitle || data.specialevent || data.eventtitle || '';
    var eventCard = document.getElementById('specialEventCard');
    if (eventTitle) {
      document.getElementById('specialEventTitle').textContent = eventTitle;
      document.getElementById('specialEventBadge').textContent = data.specialeventbadge || data.eventbadge || 'Special Presentation';
      document.getElementById('specialEventDesc').textContent = data.specialeventdescription || data.specialeventdesc || data.eventdesc || '';
      eventCard.style.display = 'block';
    } else eventCard.style.display = 'none';
  };

  window.handleProgram = function(response) {
    var rows = extractTable(response);
    if (!rows || rows.length < 1) return;
    var container = document.getElementById('programList');
    container.innerHTML = '';
    var startIdx = (rows[0][0] && (rows[0][0].toLowerCase() === 'label' || rows[0][0].toLowerCase() === 'item')) ? 1 : 0;
    for (var i = startIdx; i < rows.length; i++) {
      var label = rows[i][0] || '', details = rows[i][1] || '', link = rows[i][2] || '';
      if (!label && !details) continue;
      var itemDiv = document.createElement('div');
      itemDiv.className = 'program-item';
      itemDiv.innerHTML = link
        ? '<div><div class="program-label">' + label + '</div><div style="font-size:12px;color:var(--text-muted);">' + details + '</div></div><a class="hymn-link" href="' + link + '" target="_blank" rel="noopener noreferrer">↗ Open</a>'
        : '<span class="program-label">' + label + '</span><span class="program-val">' + details + '</span>';
      container.appendChild(itemDiv);
    }
  };

  window.handleSchedule = function(response) {
    var rows = extractTable(response);
    var sundayContainer = document.getElementById('sundayTimeline');
    var youthContainer = document.getElementById('youthTimeline');
    var sundayBlocks = [], sundayMap = {}, customYouthBlocks = [];
    var startIdx = 0;
    if (rows[0] && rows[0][0] && (rows[0][0].toLowerCase() === 'day' || (rows[0][2] && rows[0][2].toLowerCase().indexOf('title') !== -1))) startIdx = 1;

    for (var i = startIdx; i < rows.length; i++) {
      var row = rows[i] || [];
      var dayStr = (row[0] || '').trim();
      var dateStr = (row[1] || '').trim();
      var titleStr = (row[2] || '').trim();
      var timeStr = (row[3] || '').trim();
      var subText = (row[4] || '').trim();
      var linkTxt = (row[5] || '').trim();
      var linkUrl = (row[6] || '').trim();
      if (!dayStr && !titleStr && !timeStr) continue;
      if (dayStr.toLowerCase() === 'day' || titleStr.toLowerCase().indexOf('title') !== -1) continue;

      if (/^sun/i.test(dayStr)) {
        var sKey = timeStr + '___' + titleStr;
        if (!sundayMap[sKey]) {
          sundayMap[sKey] = { time: timeStr, title: titleStr, sub: subText, links: [] };
          sundayBlocks.push(sundayMap[sKey]);
        }
        if (linkTxt && linkUrl) sundayMap[sKey].links.push({ text: linkTxt, url: linkUrl });
      } else {
        if ((dayStr + ' ' + titleStr + ' ' + subText).toLowerCase().indexOf('valiant') !== -1 && !isValiantWeek()) continue;
        var dateInfo = resolveEventDate(dayStr, dateStr);
        customYouthBlocks.push({
          timestamp: dateInfo.timestamp,
          dateDisplay: dateInfo.displayDate,
          time: timeStr || '7:00 – 8:00 pm',
          title: titleStr,
          sub: subText,
          linkText: linkTxt,
          linkUrl: linkUrl
        });
      }
    }

    customYouthBlocks.sort(function(a, b) { return a.timestamp - b.timestamp; });

    if (sundayContainer) {
      sundayContainer.innerHTML = '';
      sundayBlocks.forEach(function(b) {
        var linksHtml = '';
        if (b.links.length) {
          linksHtml = '<div class="class-grid">' + b.links.map(function(l) {
            return '<a class="lesson-link-btn" href="' + l.url + '" target="_blank" rel="noopener noreferrer"><span>' + l.text + '</span><span>↗</span></a>';
          }).join('') + '</div>';
        }
        var slotDiv = document.createElement('div');
        slotDiv.className = 'time-slot';
        slotDiv.innerHTML = '<span class="time-badge">' + formatBadgeTime(b.time) + '</span><div class="time-content"><div class="time-name">' + b.title + '</div>' + (b.sub ? '<div class="time-sub">' + b.sub + '</div>' : '') + linksHtml + '</div>';
        sundayContainer.appendChild(slotDiv);
      });
    }

    if (youthContainer) {
      youthContainer.innerHTML = '';
      customYouthBlocks.forEach(function(yb) {
        var slotDiv = document.createElement('div');
        slotDiv.className = 'time-slot';
        slotDiv.innerHTML = '<span class="time-badge accent-badge">' + formatBadgeTime(yb.time) + '</span><div class="time-content"><div class="time-name">' + yb.title + '</div>' + (yb.dateDisplay ? '<div class="time-date-line">' + yb.dateDisplay + '</div>' : '') + (yb.sub ? '<div class="time-sub">' + yb.sub + '</div>' : '') + (yb.linkText && yb.linkUrl ? '<div class="class-grid"><a class="lesson-link-btn" href="' + yb.linkUrl + '" target="_blank"><span>' + yb.linkText + '</span><span>↗</span></a></div>' : '') + '</div>';
        youthContainer.appendChild(slotDiv);
      });
    }
  };

  window.handleDirectory = function(response) {
    var rows = extractTable(response);
    if (!rows || rows.length < 1) return;
    var container = document.getElementById('directoryList');
    var startIdx = (rows[0][0] && (rows[0][0].toLowerCase() === 'role' || rows[0][0].toLowerCase() === 'position')) ? 1 : 0;
    if (rows.length > startIdx) container.innerHTML = '';
    for (var i = startIdx; i < rows.length; i++) {
      var role = rows[i][0] || '', name = rows[i][1] || '', phone = rows[i][2] || '', email = rows[i][3] ? rows[i][3].trim() : '';
      if (!role && !name) continue;
      var cleanPhone = phone.replace(/\D/g, '');
      var buttons = '';
      if (cleanPhone) {
        buttons += '<a class="action-btn" href="tel:' + cleanPhone + '" aria-label="Call"><svg fill="currentColor" viewBox="0 0 24 24"><path d="M6.62 10.79a15.053 15.053 0 006.59 6.59l2.2-2.2a1 1 0 011.02-.24c1.12.37 2.33.57 3.57.57a1 1 0 011 1V20a1 1 0 01-1 1A17 17 0 013 4a1 1 0 011-1h3.5a1 1 0 011 1c0 1.25.2 2.45.57 3.57a1 1 0 01-.24 1.02l-2.21 2.2z"/></svg></a>';
        buttons += '<a class="action-btn" href="sms:' + cleanPhone + '" aria-label="Text"><svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"/></svg></a>';
      }
      if (email) buttons += '<a class="action-btn" href="mailto:' + email + '" aria-label="Email"><svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/></svg></a>';
      var rowDiv = document.createElement('div');
      rowDiv.className = 'directory-row';
      rowDiv.innerHTML = '<div><div class="dir-role">' + role + '</div><div class="dir-name">' + name + '</div></div>' + (buttons ? '<div class="dir-actions">' + buttons + '</div>' : '');
      container.appendChild(rowDiv);
    }
  };

  window.handleAnnouncements = function(response) {
    var rows = extractTable(response);
    if (!rows || rows.length < 1) return;
    var container = document.getElementById('announcementsList');
    container.innerHTML = '';
    var startIdx = (rows[0][1] && (rows[0][1].toLowerCase() === 'title' || rows[0][0].toLowerCase() === 'tag')) ? 1 : 0;
    for (var i = startIdx; i < rows.length; i++) {
      var tag = rows[i][0] || '', title = rows[i][1] || '', body = rows[i][2] || '', actionText = rows[i][3] || '', actionUrl = rows[i][4] || '';
      if (!title && !body) continue;
      var html = '';
      if (tag) html += '<div class="notice-tag">' + tag + '</div>';
      if (title) html += '<div class="notice-title">' + title + '</div>';
      if (body) html += '<div class="notice-body">' + body;
      if (actionText && actionUrl) html += '<div class="signup-card"><span class="signup-text">' + actionText + '</span><a class="signup-btn" href="' + actionUrl + '" target="_blank" rel="noopener noreferrer">Open Link ↗</a></div>';
      if (body) html += '</div>';
      var noticeDiv = document.createElement('div');
      noticeDiv.className = 'notice-item';
      noticeDiv.innerHTML = html;
      container.appendChild(noticeDiv);
    }
  };

  document.addEventListener('DOMContentLoaded', function() {
    loadScript('Admin', 'handleAdmin');
    loadScript('General', 'handleGeneral');
    loadScript('Program', 'handleProgram');
    loadScript('Schedule', 'handleSchedule');
    loadScript('Directory', 'handleDirectory');
    loadScript('Announcements', 'handleAnnouncements');
  });
</script>
