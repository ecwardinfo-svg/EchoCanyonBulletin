<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Echo Canyon Ward • Digital Bulletin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Playfair+Display:ital,wght@0,600;0,700;1,600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #F8FAFC;
      --card-bg: #FFFFFF;
      --card-border: #E2E8F0;
      --primary: #1E3A8A;
      --primary-light: #EFF6FF;
      --accent: #0D9488;
      --accent-light: #F0FDFA;
      --text-main: #0F172A;
      --text-muted: #64748B;
      --text-dim: #94A3B8;
      --shadow-sm: 0 1px 2px rgba(0,0,0,0.04);
      --shadow-md: 0 4px 12px -2px rgba(15, 23, 42, 0.06), 0 2px 6px -1px rgba(15, 23, 42, 0.04);
      --radius: 16px;
    }

    [data-theme="dark"] {
      --bg: #090D16;
      --card-bg: #111827;
      --card-border: #1F2937;
      --primary: #60A5FA;
      --primary-light: #1E293B;
      --accent: #2DD4BF;
      --accent-light: #132E2C;
      --text-main: #F3F4F6;
      --text-muted: #9CA3AF;
      --text-dim: #6B7280;
      --shadow-sm: 0 1px 2px rgba(0,0,0,0.4);
      --shadow-md: 0 4px 14px rgba(0,0,0,0.3);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      min-height: 100vh;
      line-height: 1.5;
      padding-bottom: 120px;
      transition: background 0.25s ease, color 0.25s ease;
    }

    .app-shell {
      width: 100%;
      max-width: 440px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .section-anchor {
      scroll-margin-top: 24px;
    }

    /* Top Bar */
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 4px 2px 8px;
    }

    .ward-pill {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--accent);
      background: var(--accent-light);
      padding: 4px 10px;
      border-radius: 999px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .theme-toggle-btn {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      color: var(--text-main);
      width: 38px;
      height: 38px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: var(--shadow-sm);
      transition: all 0.2s;
    }
    .theme-toggle-btn:active {
      transform: scale(0.92);
    }

    /* Header Card */
    .header-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: var(--radius);
      padding: 24px 20px 20px;
      text-align: center;
      box-shadow: var(--shadow-md);
      position: relative;
      overflow: hidden;
    }

    .header-card::before {
      content: "";
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 4px;
      background: linear-gradient(90deg, #1E3A8A, #0D9488, #3B82F6);
    }

    .ward-title {
      font-family: 'Playfair Display', serif;
      font-size: 26px;
      font-weight: 700;
      color: var(--text-main);
      letter-spacing: -0.01em;
      margin-bottom: 2px;
    }

    .church-sub {
      font-size: 11px;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.06em;
      margin-bottom: 12px;
    }

    .date-badge {
      display: inline-block;
      font-size: 13px;
      font-weight: 600;
      color: var(--primary);
      background: var(--primary-light);
      padding: 4px 14px;
      border-radius: 20px;
    }

    /* Sacred Scripture Frame - Old Testament */
    .sacred-frame {
      margin-top: 18px;
      position: relative;
      border-radius: 12px;
      overflow: hidden;
      background: linear-gradient(180deg, #1E293B 0%, #0F172A 100%);
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.15);
      min-height: 220px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 22px 18px;
      text-align: center;
    }

    .sacred-svg {
      width: 72px;
      height: 72px;
      color: #93C5FD;
      margin-bottom: 14px;
      opacity: 0.95;
    }

    .sacred-quote {
      font-family: 'Playfair Display', serif;
      font-style: italic;
      color: #F8FAFC;
      font-size: 16px;
      line-height: 1.45;
      max-width: 310px;
    }

    .sacred-citation {
      color: #67E8F9;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      margin-top: 10px;
    }

    /* Broadcast / Zoom Callout */
    .broadcast-card {
      background: var(--primary-light);
      border: 1px solid rgba(30, 58, 138, 0.15);
      border-radius: var(--radius);
      padding: 14px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .broadcast-info {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .broadcast-icon {
      width: 34px;
      height: 34px;
      border-radius: 8px;
      background: var(--primary);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .broadcast-title {
      font-size: 13px;
      font-weight: 700;
      color: var(--text-main);
    }

    .broadcast-sub {
      font-size: 11px;
      color: var(--text-muted);
    }
